services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bess
      POSTGRES_PASSWORD: bess
      POSTGRES_DB: bess
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bess -d bess"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ADDR: ":8080"
      DATABASE_URL: "postgres://bess:bess@db:5432/bess?sslmode=disable"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
